name: Build

# Every push and PR: compile Ember, then launch it and open every page (smoke test).
# Nothing is published here; releases come from release.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Ember/Ember.csproj -c Release -r win-x64 --self-contained true -o publish 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error AVLN|XamlX' |
              Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Smoke test (launch Ember and open every page)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\Ember.exe -ArgumentList '--smoke-test' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "::error::Ember did not exit within 120 seconds"; exit 1 }
          if ($p.ExitCode -ne 0) {
            "::error::Ember crashed during the smoke test (exit code $($p.ExitCode))."
            $log = Join-Path $env:APPDATA 'Ember\crash.log'
            if (Test-Path $log) { Get-Content $log | Select-Object -First 30 | ForEach-Object { "::error::$_" } }
            exit 1
          }
          Write-Host "Smoke test passed."
